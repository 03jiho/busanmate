# BusanMate 설정 (SDD §10.3). 모든 수치는 초안 값이며 평가 결과를 보고 조정한다.
# 비밀값은 여기에 두지 않는다 -> .env

llm:                                # 제공자는 .env의 LLM_PROVIDER (기본 gemini)
  # 앞에서부터 시도, 503(수요 과다)·429(한도)면 다음 모델로 (2026-11-04 확인: 2.5-flash는 신규 사용자 불가)
  models: [gemini-3.5-flash-lite, gemini-3.5-flash, gemini-3.8-flash]
  temperature: 0.2
  timeout_s: 15                     # 모델 하나의 최대 대기 (Gemini는 10초보다 짧은 기한을 400으로 거부)
  min_timeout_s: 10                 # HTTP 기한의 하한 (Gemini는 10초보다 짧은 기한을 400으로 거부)
  min_wait_s: 3                     # 남은 예산이 이보다 짧으면 호출하지 않고 바로 규칙 기반으로 (기다리는 시간은 예산까지만)
  total_timeout_s: 15               # 폴백 모델·429 재시도까지 합친 한 번의 호출 최대 대기
  request_budget_s: 20              # 질문 하나의 전체 응답 시간 상한(검색·날씨·길찾기 포함). LLM은 이 안에서만 부른다
  reserve_s: 2                      # 마감 전에 남겨 둘 시간(LLM 뒤의 응답 조립·전송). 남은 시간 - reserve_s < min_wait_s면 LLM을 건너뜀
  retry_429_backoff_s: 1            # 429(한도)·503(과부하)면 이만큼 기다렸다가 같은 모델로 한 번 더 (지수 백오프의 첫 단계)
  cooldown_s: 60                    # 모든 모델이 실패하면 이 시간 동안 LLM을 건너뛰고 규칙 기반으로 처리
  cache_ttl_s: 86400                # 조건 추출 응답 캐시 (이동시간은 캐시 대상 아님, ADR-008)
  prompt_version: v1                # agent/prompts/<이름>_<버전>.md

embedding:
  text_provider: gemini             # 결정(2026-11-04): Gemini 임베딩 API
  text_model: gemini-embedding-001
  text_dim: 768
  batch_size: 90                    # 무료 등급: 문서 1개 = 요청 1건, 분당 100건 한도
  batch_chars: 20000                # 무료 등급 분당 30,000토큰 한도 → 배치당 글자 수 상한 (한글 1자 ≈ 1토큰 이하로 가정)
  batch_interval_s: 61              # 배치 사이 대기 (최초 적재만 수 분, 이후엔 바뀐 장소만)
  max_doc_chars: 1500               # 임베딩 문서 = 이름 + 설명 앞부분
  image_model: ViT-B-32             # 결정(2026-11-05): 로컬 open_clip
  image_pretrained: laion2b_s34b_b79k
  image_batch_size: 32

# 수집 소스 (COMP-12, DATA-01·03). url_env의 서비스 경로 뒤에 operation을 붙여 호출
sources:
  busan_attraction:
    url_env: BUSAN_ATTRACTION_URL
    operation: getAttractionKr
    kind: place
    label: 부산광역시_부산명소정보 서비스 (공공데이터포털)
    portal_url: https://www.data.go.kr/data/15063481/openapi.do   # 원본 링크가 없는 카드에 대신 보여 줄 서비스 페이지
    license: 공공데이터포털 부산광역시 제공, 이용허락범위 제한 없음
  busan_food:
    url_env: BUSAN_FOOD_URL
    operation: getFoodKr
    kind: place
    label: 부산광역시_부산맛집정보 서비스 (공공데이터포털)
    portal_url: https://www.data.go.kr/data/15063472/openapi.do   # 원본 링크가 없는 카드에 대신 보여 줄 서비스 페이지
    license: 공공데이터포털 부산광역시 제공, 이용허락범위 제한 없음
  busan_festival:
    url_env: BUSAN_FESTIVAL_URL
    operation: getFestivalKr
    kind: festival
    label: 부산광역시_부산축제정보 서비스 (공공데이터포털)
    portal_url: https://www.data.go.kr/data/15063500/openapi.do   # 원본 링크가 없는 카드에 대신 보여 줄 서비스 페이지
    license: 공공데이터포털 부산광역시 제공, 이용허락범위 제한 없음

ingest:
  page_size: 1000
  timeout_s: 60
  seed_file: data/seed/busan_seed.csv   # python -m pipeline.run --seed (API 원본 행 48건, 2026-11-05 수집)

# 분류·실내 여부 추정 (원본에 분류 필드가 없음). 이름에 대해 위에서부터 첫 매치.
# names: 정확히 일치, keywords: 포함되면 매치, suffixes: 이름(끝의 "부산" 제외)이 그 글자로 끝나면 매치.
# indoor: true/false/null(불명)
classify:
  # 서비스 전체의 장소 분류 목록 (검색 필터·해석기·화면 아이콘이 이 이름을 쓴다). 매핑은 아래 rules(위에서부터 처음 맞는 것)
  categories: [음식점, 카페, 해변, 공원·자연, 문화시설, 관광지, 거리·마을, 시장, 사찰·종교]
  food: {category: 음식점, indoor: true}
  # 맛집 데이터 중 카페: 이름이나 대표 메뉴에 이 말이 있으면 음식점이 아니라 카페 (코스 수정의 "카페 추가")
  cafe: {category: 카페, indoor: true, keywords: [카페, 커피, 디저트, 베이커리, 브레드, 로스터, 제과, 다방, 티하우스, cafe, coffee],
         menu_keywords: [커피, 아메리카노, 라떼, 디저트, 케이크, 빙수, 말차, 전통차],
         # 이름에 '브레드' 등이 있어도 대표 메뉴가 식사면 음식점 (예: 본 앤 브레드 = 스테이크하우스, 2026-11-12)
         food_menu_keywords: [스테이크, 한우, 갈비, 고기, 코스요리, 육회, 회, 초밥, 국밥, 정식, 한식, 일식, 중식, 양식, 파스타, 피자]}
  rules:
    - {category: 시장, indoor: null, keywords: [시장, 지하도상가]}
    # 섬·공원·산책로는 바닷가에 있어도 해변이 아니라 공원·자연 (동백섬, 해안 산책로, 해변공원; 2026-11-12)
    - {category: 공원·자연, indoor: false, names: [동백섬], keywords: [산책로, 볼레길, 둘레길, 갈맷길, 해변공원], suffixes: [섬]}
    - {category: 해변, indoor: false, names: [해운대, 청사포와 미포], keywords: [해수욕장, 해변, 해안, 해파랑길]}
    - {category: 문화시설, indoor: true, keywords: [박물관, 미술관, 갤러리, 기념관, 역사관, 문화관, 문학관, 과학관, 전시관, 홍보관, 체험관, 민속관, 도서관, 센터, 문화원, 국악원, 아쿠아리움, 생가, 전당, 극장, 아트, 뮤지엄], suffixes: [관]}
    - {category: 공원·자연, indoor: false, keywords: [공원, 숲, 수목원, 전망대, 등대, 계곡, 폭포, 습지, 생태, 해상케이블카, 스카이워크], suffixes: [대, 도, 산, 봉]}
    - {category: 사찰·종교, indoor: false, keywords: [성당, 교회, 향교, 사찰], suffixes: [사, 암]}
    - {category: 거리·마을, indoor: false, keywords: [마을, 골목, 거리, 광장, 길]}
  default: {category: 관광지, indoor: null}

search:                             # COMP-05, FR-002
  candidates_n: 30
  min_candidates: 2
  relax_order: [open_hours, indoor, gu]
  indoor_categories: [문화시설]       # "실내", "비 오는 날" 요청이면 이 분류(박물관·전시관 등)를 따로 찾아 후보에 넣고 우선한다
  min_indoor_attractions: 3         # 초안: 그 구의 실내 명소가 이보다 적으면 다른 구까지 찾는다(동선 반경 안의 것만 쓰인다)
  food_candidates_n: 10             # 초안: 후보에 식당이 거의 없을 때 점심용으로 보탤 식당 수(일수당)

score:                              # COMP-06, S(p) = w1·sim + w2·pref + w3·weather − w4·dist
  w_sim: 0.4
  w_pref: 0.3
  w_weather: 0.2
  w_dist: 0.1
  diversity_penalty: 0.1            # λ, 같은 분류가 이미 선택됐을 때
  weather_neutral: 0.5              # 예보 없음

course:                             # COMP-06, FR-006, FR-014
  places_per_day_min: 2
  places_per_day_max: 6
  default_available_hours: 9
  max_days: 3
  default_stay_min: 60              # 초안: 장소당 평균 체류 (아래 표에 없는 분류, 하루 장소 수 계산)
  stay_min_by_category: {거리·마을: 35, 해변: 35, 문화시설: 75, 음식점: 60, 카페: 40, 공원·자연: 50, 관광지: 60, 시장: 50, 사찰·종교: 40}
  stay_min_by_name: {미술관: 90, 박물관: 90, 전망대: 40}  # 이름에 들어 있으면 분류 값보다 우선
  shorter_ratio: 0.75               # '더 짧게': 그날 장소별 체류 시간에 곱한다(5분 단위). 모두 하한이면 한 곳을 뺀다
  min_stay_min: 20                  # 체류 시간 하한
  day_start: "10:00"                # 초안: 하루 출발 시각 (화면의 방문 예정 시각 계산 기준)
  dinner_window: ["17:30", "19:30"]  # 초안: 식당은 점심·저녁 시간대에 도착할 때만 둔다(첫 장소 10:00에 식당 금지)
  walk_taxi_hint_min: 10            # 도보 구간이 이 이상이면 화면에 '택시를 타면 약 N분'을 함께 보여 준다
  alt_max_detour_km: 8              # '다른 곳으로 교체' 후보는 우회 거리가 이 안인 같은 분류만 (멀면 후보 없음으로 안내)
  walk_no_taxi_max_min: 5           # 이 이하 도보에는 택시를 권하지 않는다(비 오는 날 야외 장소 앞뒤라도)
  lunch_window: ["11:30", "13:30"]  # 초안: 점심 시간대. 체류 합이 lunch_min_stay_min 이상이면 이 사이에 도착하는 식당 1곳을 보장
  lunch_min_stay_min: 300           # 초안: 하루 체류 합이 5시간 이상이면 점심 식당을 넣는다
  cafe_per_day: 1                   # 초안: 하루 카페 상한. 식당·카페는 연달아 두지 않는다(먹는 곳은 하루 장소의 절반 이하)
  default_move_min: 20              # 초안: K 계산용 평균 이동 시간
  walk_radius_km: 2.5               # 초안: 도보만일 때 하루 장소를 먼저 기준 장소 반경 안에서 고른다(모자라면 가까운 순)
  day_radius_km: 8                  # 초안: auto/taxi일 때 같은 기준의 반경
  walk_max_leg_min: 30              # 초안: 도보만일 때 구간 하나의 최대 도보 시간
  max_same_category_run: 2          # 같은 분류 3곳 연속 금지
  max_category_share: 0.5           # 한 분류는 하루 장소의 절반까지 (다른 분류 후보가 남아 있는 동안)
  mix_categories: [카페, 시장, 거리·마을, 공원·자연, 관광지]  # 한 분류로 쏠린 검색 결과에 같은 구에서 섞어 넣을 분류(날씨 규칙 안에서)
  food_per_day: {default: 2, food_theme: 3}  # 초안: 하루 음식점 상한(끼니 수). 분류를 음식점으로 직접 지정하면 상한 없음

budget:                             # 예상 비용 (services/budget.py). 식비는 1인, 택시비는 1대 기준
  meal_default: {음식점: 12000, 카페: 6000}   # 초안: 설명에 메뉴 가격이 없을 때
  taxi: {base_won: 4800, base_m: 2000, step_m: 132, step_won: 100}  # 부산 중형택시(2023.6~, 확인 필요). 카카오 실측 요금이 우선

named_place:                        # 사용자가 이름으로 말한 장소를 DB와 대조 (services/search.match_names)
  match_threshold: 0.8              # 초안: 정규화한 이름의 유사도가 이 이상이면 같은 장소
  similar_n: 2                      # 못 찾았을 때 안내할 비슷한 장소 수
  similar_min: 0.45                 # 초안: 이름 유사도(+분류 일치)가 이보다 낮으면 "비슷한 장소"로 안내하지 않는다
  context_categories:               # 요청 이름의 말 → 그 장소가 속할 법한 분류 (비슷한 장소 점수에 더함)
    전망대: [공원·자연, 관광지]
    타워: [관광지, 공원·자연]
    스카이: [관광지, 공원·자연]
    해수욕장: [해변]
    해변: [해변]
    시장: [시장]
    박물관: [문화시설]
    미술관: [문화시설]
    공원: [공원·자연]
    식당: [음식점]
    횟집: [음식점]
    카페: [카페]
    커피: [카페]
  generic_suffixes: [해수욕장, 해변, 유원지, 공원, 시장, 마을, 거리, 전망대, 산, 섬]  # DB 이름 + 이 말이면 같은 장소

preferences:                        # FR-005 선호 테마 → 가산점을 줄 분류 (pref 항)
  theme_categories:
    바다: [해변]                      # 공원·자연을 넣으면 장산·수목원 같은 내륙이 바다 코스에 섞인다
    자연: [공원·자연]
    역사·문화: [문화시설, 사찰·종교, 거리·마을]
    맛집: [음식점]
    쇼핑·시장: [시장, 거리·마을]
    핫플: [관광지, 거리·마을]
  theme_near:                       # 이 분류 장소에서 km 안이면 분류가 달라도 테마 가산점 (해변 옆 공원·카페·산책로 등)
    # ponytail: 해변 대표 좌표 1점 + 이름 키워드라 놓치는 해안 장소가 있다 → 해안선 데이터가 생기면 교체
    바다: {category: 해변, km: 1.0, keywords: [해수욕장, 해변, 해안, 바다, 해양, 등대, 포구, 흰여울, 태종대, 이기대,
                                             오륙도, 용궁사, 오랑대, 송도, 다대포, 민락, 광안, 청사포, 블루라인, 스카이워크]}

weather:                            # COMP-07, FR-004
  rain_prob_threshold: 60
  rain_outdoor_max: 2               # 초안: 강수확률이 임계 이상인 날의 야외 장소 상한(실내 후보가 모자랄 때만 넘김)
  rain_outdoor_penalty: 0.3
  summary_rain_min: 30              # 요약에서 날씨를 조건으로 꼭 다룰 강수확률(이상)
  rain_first_outdoor_km: 50         # 비 오는 날 첫 장소가 야외면 더하는 거리 비용(가능하면 실내로 시작)
  rain_hour_weight_km: 3             # 비 오는 날 순서 정하기: 야외 장소 체류 시간대 강수확률 100%를 이동거리 몇 km로 칠지         # 초안: 그날 야외 장소 점수에서 더 뺀다(날씨 항 0과 별도)
  outdoor_categories: [해변, 공원·자연]
  outdoor_name_keywords: [산책로, 전망대, 둘레길, 갈맷길, 해수욕장, 해변, 해안, 공원, 스카이워크, 등대, 계곡]
  outdoor_desc_keywords: [야경]      # 설명에 이 말이 있으면 야외(야경 명소)로 본다
  cache_ttl_s: 3600
  source_label: 기상청 단기예보 (공공데이터포털)
  portal_url: https://www.data.go.kr/data/15084084/openapi.do
  license: 공공누리 제1유형 (출처 표시)
  operation: getVilageFcst          # KMA_FORECAST_URL 서비스 경로 뒤에 붙인다
  default_location: {lat: 35.1798, lng: 129.0750}  # 후보가 없을 때 쓸 위치(부산시청 → 격자 98, 76)
  day_hours: [9, 21]                # 이 시간대 강수확률의 최댓값을 그날 값으로

kakao:
  timeout_s: 5                      # 택시 구간 실측 (KAKAO_MOBILITY_DIRECTIONS_URL, 자동차 경로만)

travel:                             # COMP-07, FR-007. 이동시간은 저장·캐시하지 않는다
  # 이동수단은 도보·택시만 (결정 2026-11-04). mode=auto면 구간 거리로 자동 선택
  modes: [auto, walk, taxi]
  default_mode: auto
  walk_max_km: 1.5                  # 초안: auto에서 이 거리(보정 후) 이하면 도보, 넘으면 택시
  detour_factor:                    # 직선거리 × 구간 보정계수
    same_gu: 1.3
    adjacent_gu: 1.5                # ponytail: 인접 여부 표 없이 '다른 구'는 모두 이 값, 오차 크면 인접 구 표 추가
    sea_or_bridge: 1.8
  sea_bridge_gu: [영도구, 강서구]     # 한쪽만 이 구에 있으면 바다·다리 구간으로 본다
  speed_kmh:                        # 초안: 코스 계획용 평균 속도 (택시 실측은 표시 시점에 카카오로)
    walk: 4.0
    taxi: 25.0

image:                              # COMP-08, FR-008·009
  max_bytes: 10485760               # 10MB
  allowed_types: [image/jpeg, image/png]
  match_threshold: 0.80             # τ: 최고 유사도가 이 이상이면 '인식', 미만이면 VLM 장면 설명으로 유사 분위기 추천
  top_images: 10
  result_count: 5
  download_timeout_s: 10            # 수집 시 장소 이미지 내려받기
  download_max_bytes: 10485760

agent:                              # COMP-03
  max_tool_calls_per_turn: 6
  recent_turns: 6                   # 초안: 세션에 보관할 최근 대화 턴 수

session:                            # COMP-10
  ttl_s: 7200

api:                                # COMP-02
  rate_limit_per_min: 20
  max_message_chars: 500            # 초안: 질의 길이 제한

tools:
  timeout_s: 3
  max_retries: 3                    # 수집 소스 실패 시 (ERR-008)
